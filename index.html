<title>Travel & Experiences – Vocabulary Practice</title>
<style>
:root{--blue:#2457c5;--navy:#172554;--yellow:#ffdf57;--green:#16834a;--red:#c13d3d;--bg:#f3f7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#172554}
header{background:linear-gradient(120deg,#1746a2,#3987df);color:white;text-align:center;padding:24px 14px}
h1{margin:0 0 7px;font-size:clamp(23px,4vw,34px)}header p{margin:0;font-size:14px}
main{max-width:900px;margin:20px auto;padding:0 14px 36px}
.tabs{display:flex;gap:10px;margin-bottom:14px}.tab{flex:1;border:0;border-radius:12px;padding:13px 8px;background:#dce8ff;color:#1746a2;font-weight:700;cursor:pointer}.tab.active{background:var(--blue);color:#fff}
.panel{background:#fff;border-radius:18px;padding:clamp(15px,3vw,25px);box-shadow:0 5px 20px #1b3d7512}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.progress{height:9px;background:#e6edfa;border-radius:10px;overflow:hidden;margin:14px 0}.bar{height:100%;background:#2e83df;width:0;transition:width .2s}
.muted{color:#64748b;font-size:14px}.prompt{font-size:20px;font-weight:700;text-align:center;margin:16px 0 6px}
.meaning{text-align:center;color:#1746a2;font-size:20px;font-weight:700;margin:10px 0 18px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.choice{border:3px solid #d9e5fa;background:#fff;border-radius:14px;padding:6px;cursor:pointer;min-width:0;transition:.15s}
.choice:hover{border-color:#5791e8;transform:translateY(-2px)}.choice img{width:100%;height:155px;object-fit:cover;border-radius:9px;display:block}
.choice .cap{font-size:14px;font-weight:700;padding:7px 3px 5px;color:#243b68;min-height:40px}
.choice.correct{border-color:var(--green);background:#eafff1}.choice.wrong{border-color:var(--red);background:#fff0f0}.choice:disabled{cursor:default;transform:none;opacity:1}
.feedback{margin:15px 0;padding:12px;border-radius:10px;font-weight:700;text-align:center;display:none}.feedback.good{display:block;background:#e5f8ec;color:#12643a}.feedback.bad{display:block;background:#fff0f0;color:#a52c2c}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
button.action{border:0;border-radius:11px;padding:12px 20px;background:var(--blue);color:white;font-weight:700;cursor:pointer;font-size:15px}button.secondary{background:#e7eefb;color:#1746a2}button:disabled{opacity:.5;cursor:not-allowed}
.writebox{max-width:500px;margin:0 auto;text-align:center}.writebox img{width:100%;max-height:280px;object-fit:contain;background:#f5f8ff;border-radius:14px;padding:6px}
input{width:100%;font-size:18px;padding:14px;border:2px solid #cbd8ef;border-radius:11px;margin-top:12px;text-align:center}
.score{font-weight:700;color:#1746a2}.end{text-align:center;padding:24px}.hidden{display:none!important}
@media(max-width:600px){.cards{gap:7px}.choice img{height:115px}.choice .cap{font-size:12px;min-height:48px}.meaning{font-size:18px}.prompt{font-size:18px}}
</style></head>

let order1=[],order2=[],i1=0,i2=0,score1=0,score2=0,locked1=false,locked2=false,answered1=0,answered2=0;
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function speak(w){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w);u.lang='en-GB';u.rate=.88;speechSynthesis.speak(u)}
function showExercise(n){document.getElementById('ex1').classList.toggle('hidden',n!==1);document.getElementById('ex2').classList.toggle('hidden',n!==2);document.getElementById('tab1').classList.toggle('active',n===1);document.getElementById('tab2').classList.toggle('active',n===2)}
function reset1(){order1=shuffle(WORDS.map((_,i)=>i));i1=0;score1=0;answered1=0;render1()}
function render1(){
 locked1=false;document.getElementById('feedback1').className='feedback';document.getElementById('feedback1').textContent='';document.getElementById('next1').disabled=true;
 if(i1>=31){document.getElementById('meaning1').textContent='Exercise completed!';document.getElementById('choices').innerHTML='';document.getElementById('count1').textContent='31 of 31 completed';document.getElementById('bar1').style.width='100%';document.getElementById('next1').textContent='Restart';document.getElementById('next1').disabled=false;return}
 document.getElementById('next1').textContent='Next';let target=order1[i1];let opts=shuffle([target,...shuffle(WORDS.map((_,i)=>i).filter(x=>x!==target)).slice(0,2)]);
 document.getElementById('meaning1').textContent=WORDS[target].word;document.getElementById('count1').textContent=`Question ${i1+1} of 31`;document.getElementById('score1').textContent=`Score: ${score1} / 31`;document.getElementById('bar1').style.width=(i1/31*100)+'%';
 let box=document.getElementById('choices');box.innerHTML='';
 opts.forEach(k=>{let w=WORDS[k],b=document.createElement('button');b.className='choice';b.innerHTML=`<img src="${w.img}" alt="Picture"><div class="cap">${w.vi}</div>`;b.onclick=()=>{speak(w.word);if(locked1)return;locked1=true;answered1++;let ok=k===target;if(ok){score1++;b.classList.add('correct')}else{b.classList.add('wrong');[...box.children].forEach((el,j)=>{if(opts[j]===target)el.classList.add('correct')})} [...box.children].forEach(el=>el.disabled=true);let f=document.getElementById('feedback1');f.className='feedback '+(ok?'good':'bad');f.textContent=ok?'Correct! Well done.':`Incorrect. The correct answer is: ${WORDS[target].word}`;document.getElementById('score1').textContent=`Score: ${score1} / 31`;document.getElementById('next1').disabled=false};box.appendChild(b)});
}
function next1(){if(i1>=31){reset1();return}if(!locked1)return;i1++;render1()}
function reset2(){order2=shuffle(WORDS.map((_,i)=>i));i2=0;score2=0;answered2=0;render2()}
function render2(){
 locked2=false;document.getElementById('feedback2').className='feedback';document.getElementById('feedback2').textContent='';document.getElementById('answer').value='';document.getElementById('answer').disabled=false;
 document.getElementById('check2').classList.remove('hidden');document.getElementById('skip2').classList.remove('hidden');document.getElementById('next2').classList.add('hidden');
 if(i2>=31){document.getElementById('meaning2').textContent='Exercise completed!';document.getElementById('writeimg').classList.add('hidden');document.getElementById('answer').classList.add('hidden');document.getElementById('count2').textContent='31 of 31 completed';document.getElementById('bar2').style.width='100%';return}
 let w=WORDS[order2[i2]];document.getElementById('writeimg').classList.remove('hidden');document.getElementById('answer').classList.remove('hidden');document.getElementById('meaning2').textContent=w.vi;document.getElementById('writeimg').src=w.img;document.getElementById('writeimg').alt='Picture for '+w.vi;document.getElementById('count2').textContent=`Question ${i2+1} of 31`;document.getElementById('score2').textContent=`Score: ${score2} / 31`;document.getElementById('bar2').style.width=(i2/31*100)+'%';
}
